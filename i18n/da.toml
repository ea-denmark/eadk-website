[faqLabel]
other = "Ofte Stillede Spørgsmål"

[faqWhatIsEA]
other = "Hvad er effektiv altruisme?"

[faqWhatIsEAAnswer]
other = "Effektiv altruisme er et forskningsfelt og fællesskab, der er dedikeret til at finde de bedste måder at hjælpe andre på. Det bruger evidens til at finde de mest effektive måder at forbedre verden på. Det handler ikke bare om at spørge \"Hvordan kan jeg gøre en forskel?\" men \"Hvordan kan jeg gøre den <em>største</em> forskel?\""

[faqGetInvolved]
other = "Hvordan kan jeg være med?"

[faqGetInvolvedAnswer]
other = "Der er mange måder at komme i gang på! Du kan deltage i et af vores arrangementer, tilmelde dig en introduktionslæsegruppe, booke en gratis karrieresnak, eller starte med at besøge <a href=\"https://giveffektivt.dk\">Giv Effektivt</a> for at lære om effektiv donation."

[faqDonate]
other = "Hvor bør jeg donere?"

[faqDonateAnswer]
other = "Vi anbefaler at donere gennem <a href=\"https://giveffektivt.dk\">Giv Effektivt</a>, vores danske søsterorganisation. De følger forskning fra GiveWell og andre evalueringsorganer for at anbefale velgørenhedsorganisationer, der redder flest liv per doneret krone. Du får også dansk skattefradrag."

[faqOnlyMoney]
other = "Handler EA kun om at donere penge?"

[faqOnlyMoneyAnswer]
other = "Slet ikke! Selvom effektiv donation er en vigtig del, omfatter EA også karrierevalg, frivilligt arbejde, forskning og fællesskab. Mange oplever, at valget af karriere er en af de beslutninger med størst impact. Vores karrierevejledning kan hjælpe dig med at tænke dine muligheder igennem."

[mediaCoverage]
other = "Mediedækning"

[chaptersIntro]
other = "Effektiv Altruisme Danmark har aktive lokalforeninger over hele landet. Find dit lokale fællesskab og bliv involveret i arrangementer, diskussioner og projekter nær dig."
