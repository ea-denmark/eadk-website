[whatIsEA]
other = "Hvad er effektiv altruisme?"

[whatIsEADesc1]
other = "Mange ønsker at gøre en meningsfuld forskel i verden. At opleve lidelse, uretfærdighed og død får os til at ville handle. Men at finde en konkret løsning på disse problemer, og ikke mindst at implementere den, er ikke ligetil."

[whatIsEADesc2]
other = "Det er præcis det, effektiv altruisme forsøger at løse. Effektiv altruisme er et forskningsfelt, der handler om at maksimere effekten af vores indsats for at hjælpe andre. Ved hjælp af solid evidens og grundige overvejelser forsøger vi at besvare spørgsmålet om, hvordan vi hjælper andre mest effektivt."

