baseURL = 'https://effectivealtruism.dk/'
title = 'Effective Altruism Denmark'
theme = 'eadk'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false

[languages]
  [languages.en]
    languageCode = 'en'
    languageName = 'EN'
    title = 'Effective Altruism Denmark'
    weight = 1
    [languages.en.params]
      description = "How do we help others the most with our time?"
      tagline = "Let's Get Better at Doing Good"

    [[languages.en.menu.main]]
      name = "What is EA?"
      weight = 1
      url = "/introduction/"
    [[languages.en.menu.main]]
      name = "Events"
      weight = 3
      url = "/events/"
    [[languages.en.menu.main]]
      name = "Local Groups"
      weight = 4
      url = "/chapters/"
    [[languages.en.menu.main]]
      name = "About Us"
      weight = 5
      url = "/about/"
    [[languages.en.menu.main]]
      name = "Donate"
      weight = 7
      url = "https://giveffektivt.dk"

  [languages.da]
    languageCode = 'da'
    languageName = 'DA'
    title = 'Effektiv Altruisme Danmark'
    weight = 2
    [languages.da.params]
      description = "Hvordan hjælper vi andre mest med vores tid?"
      tagline = "Lad os blive bedre til at gøre godt"

    [[languages.da.menu.main]]
      name = "Hvad er EA?"
      weight = 1
      url = "/da/introduktion/"
    [[languages.da.menu.main]]
      name = "Arrangementer"
      weight = 3
      url = "/da/arrangementer/"
    [[languages.da.menu.main]]
      name = "Lokalforeninger"
      weight = 4
      url = "/da/lokalforeninger/"
    [[languages.da.menu.main]]
      name = "Om Os"
      weight = 5
      url = "/da/om-os/"
    [[languages.da.menu.main]]
      name = "Donér"
      weight = 7
      url = "https://giveffektivt.dk"

[params]
  # Design variants: theme = "norge" | "roed".
  # themePicker shows a floating switcher for comparing them side by side.
  # It only renders under `hugo server`; production builds never include it.
  theme = "roed"
  themePicker = true
  email = "contact@effectivealtruism.dk"
  address = "Vesterbrogade 149, Bygning 5"
  city = "1620 København"
  cvr = "41417226"
  facebook = "https://www.facebook.com/EffectiveAltruismDK"
  linkedin = "https://www.linkedin.com/company/11438277"
  instagram = "https://www.instagram.com/effectivealtruismdenmark/"
  youtube = "https://www.youtube.com/channel/UCGmtXxP3dHWz9Tte_k9spzQ/featured"
  donateURL = "https://giveffektivt.dk"
  slackInviteURL = "https://join.slack.com/t/eadenmark/shared_invite/zt-34qnyn9ma-gM2gCSp2I~xQN96kp~FZlA"
  slackOfficeChannelURL = "https://eadenmark.slack.com/archives/C08RK1A0J1Z"

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true
